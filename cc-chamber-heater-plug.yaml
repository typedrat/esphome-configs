# =============================================================================
# Chamber Heater Plug
# Sonoff S31 Lite switching the Centauri Carbon chamber heater
# =============================================================================
# Renames the reusable S31 Lite base for this outlet's job, then trades its
# plain on/off relay for a 0-100% power control: sigma-delta modulation over a
# 30s window, driven either by Klipper's PID over MQTT or by hand.
#
# The relay is mechanical, so the window is long on purpose. Worst-case duty
# works out to ~2880 operations/day, which the contacts can sustain for years.
# The blue outlet LED sits across the relay, so it blinks with the duty cycle.
# =============================================================================

substitutions:
  name: cc-chamber-heater-plug
  friendly_name: Chamber Heater Plug
  relay_name: Chamber Heater
  # Moonraker mirrors each field of Klipper's chamber heater object under here.
  # This comes from Moonraker's own subscription, not from a gcode macro, so it
  # keeps arriving while a blocking command like M191 holds the gcode queue.
  klipper_state: "klipper/centauri_carbon/klipper/state/heater_generic chamber"

packages:
  base: !include sonoff-s31-lite.yaml

# =============================================================================
# KLIPPER LINK
# =============================================================================

mqtt:
  id: mqtt_client
  broker: iserlohn.lan
  port: 35550
  username: esphome
  password: !secret mqtt_password
  topic_prefix: esphome/${name}

  # Riding out a broker outage beats rebooting through one: the watchdog below
  # already fails the heater safe, and a reboot loop would only add relay wear.
  reboot_timeout: 0s

  # Every field arrives as {"eventtime":…,"value":…}. Moonraker publishes a
  # field only when it changes, so power can sit silent for minutes while
  # temperature keeps ticking every 2s.
  on_message:
    - topic: ${klipper_state}/power
      then:
        - lambda: |-
            // A null value means the chamber object is gone; atof reads that as
            // 0, which is the right answer for a heater
            auto p = x.find("\"value\":");
            if (p == std::string::npos) return;
            float v = atof(x.c_str() + p + 8);
            v = v < 0 ? 0 : (v > 1 ? 1 : v);
            id(klipper_level) = v * 100.0f;
            id(last_level_ms) = millis();
            // Applied here for responsiveness; the interval below re-asserts it,
            // since this topic only fires when Klipper's PID output moves
            id(apply_klipper_level)->execute();

    - topic: ${klipper_state}/temperature
      then:
        - lambda: |-
            auto p = x.find("\"value\":");
            if (p == std::string::npos || x.find("null", p) == p + 8) return;
            id(chamber_temp).publish_state(atof(x.c_str() + p + 8));
            // Chamber temperature always drifts, so it is the only field that
            // reliably proves Klipper is still talking
            id(last_level_ms) = millis();

    - topic: ${klipper_state}/target
      then:
        - lambda: |-
            auto p = x.find("\"value\":");
            if (p == std::string::npos || x.find("null", p) == p + 8) return;
            id(chamber_target).publish_state(atof(x.c_str() + p + 8));

globals:
  # Timestamp of the last word from Klipper, the duty cycle it last asked for,
  # and whether the level standing now came from it. A level set by hand while
  # Klipper is quiet is nobody's to time out.
  - id: last_level_ms
    type: uint32_t
    initial_value: "0"
  - id: klipper_level
    type: float
    initial_value: "0.0f"
  - id: mqtt_driven
    type: bool
    initial_value: "false"

# Writing the number clears mqtt_driven through on_value, so every path that
# sets a Klipper-owned level has to claim it back afterwards.
script:
  - id: apply_klipper_level
    then:
      - lambda: |-
          const float cur = id(heater_power).state;
          if (std::isnan(cur) || fabsf(id(klipper_level) - cur) >= 0.5f) {
            id(heater_power).make_call().set_value(id(klipper_level)).perform();
          }
          id(mqtt_driven) = true;

# Klipper's own view of the chamber, mirrored onto the plug so the heater and
# the temperatures it answers to appear as one device.
sensor:
  - platform: template
    name: Chamber Temperature
    id: chamber_temp
    unit_of_measurement: "°C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never

  - platform: template
    name: Chamber Target
    id: chamber_target
    unit_of_measurement: "°C"
    device_class: temperature
    accuracy_decimals: 1
    update_interval: never

# =============================================================================
# HEATER POWER
# =============================================================================

# Heater Power owns the relay now, so it stops being a user-facing entity.
switch:
  - id: !extend relay
    internal: true

output:
  - platform: sigma_delta_output
    id: heater_output
    update_interval: 30s
    # The relay is internal and the switch component only logs at VERBOSE, so
    # these are the only trace of the heater actually being driven.
    turn_on_action:
      - switch.turn_on: relay
      - logger.log: "Heater relay closed"
    turn_off_action:
      - switch.turn_off: relay
      - logger.log: "Heater relay opened"

number:
  - platform: template
    name: Heater Power
    id: heater_power
    icon: mdi:fire
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    optimistic: true
    # Come up cold after a power cut, as the base relay does
    restore_value: false
    initial_value: 0
    # on_value rather than set_action: this also runs for initial_value, so the
    # output starts at a known level instead of floating until first command
    on_value:
      - output.set_level:
          id: heater_output
          level: !lambda "return x / 100.0;"
      - lambda: "id(mqtt_driven) = false;"

# The front button moves the setpoint instead of the relay; toggling the relay
# under the modulator would only last until its next cycle.
binary_sensor:
  - id: !remove button

  - platform: gpio
    id: power_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - number.set:
          id: heater_power
          value: !lambda "return id(heater_power).state > 0 ? 0 : 100;"

# =============================================================================
# WATCHDOG & LINK INDICATOR
# =============================================================================

interval:
  - interval: 5s
    then:
      # While Klipper is talking it owns the setpoint: re-assert it, or a manual
      # change would stand until its PID output happened to move. Once it goes
      # quiet, drop the heater and leave the number free to be set by hand.
      - if:
          condition:
            lambda: |-
              return id(last_level_ms) != 0 && millis() - id(last_level_ms) <= 60000;
          then:
            - script.execute: apply_klipper_level
          else:
            - if:
                condition:
                  lambda: "return id(mqtt_driven);"
                then:
                  - number.set:
                      id: heater_power
                      value: 0

      # Green LED lit while Klipper is actually talking to us. Driving the
      # status light instead of the raw output leaves ESPHome's own warning and
      # error blinking on top; only write on a change, or every tick would
      # publish a light state.
      - lambda: |-
          // last_level_ms 0 means Klipper has not spoken since boot; without
          // that guard the window around millis() 0 reads as fresh
          bool linked = id(mqtt_client).is_connected() && id(last_level_ms) != 0 &&
                        millis() - id(last_level_ms) <= 60000;
          if (linked != id(status_light).current_values.is_on()) {
            id(status_light).make_call().set_state(linked).perform();
          }
