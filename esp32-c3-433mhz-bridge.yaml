# =============================================================================
# ESP32-C3 433MHz Bridge
# ESP32-C3 Super Mini with a CC1101 receiver and SSD1306 OLED
# =============================================================================
# CC1101 wiring: SPI on GPIO7/8/9 with CS on GPIO6, GDO0 (demodulated data)
# on GPIO5, GDO2 (carrier sense) on GPIO10.
# =============================================================================

esphome:
  name: esp32-c3-433mhz-bridge
  friendly_name: ESP32-C3 433MHz bridge

external_components:
  # Adds the gdo2_mode option used below.
  - source: github://typedrat/esphome@typedrat/cc1101-gdo2-mode-2026.9
    components: [cc1101]
  - source:
      type: local
      path: /home/awilliams/Development/esphome-rtl433/components
    components: [rtl_433]

# =============================================================================
# CONNECTIVITY
# =============================================================================

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "ESP32-C3 433MHz Fallback"
    password: !secret rf_bridge_ap_password

captive_portal:

api:
  encryption:
    key: !secret rf_bridge_api_key

ota:
  - platform: esphome

# =============================================================================
# HARDWARE PLATFORM
# =============================================================================

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

# =============================================================================
# LOGGING & DEBUGGING
# =============================================================================

logger:

# =============================================================================
# DIAGNOSTIC SENSORS
# =============================================================================

binary_sensor:
  - platform: status
    name: Status

sensor:
  - platform: wifi_signal
    id: wifi_signal_db
    name: WiFi Signal
    update_interval: 60s

  - platform: uptime
    id: uptime_s
    name: Uptime

text_sensor:
  - platform: wifi_info
    ip_address:
      id: ip_address
      name: IP Address
    ssid:
      name: Connected SSID

# =============================================================================
# BUSES
# =============================================================================

i2c:
  - id: i2c_1
    scl: GPIO20
    sda: GPIO21
    frequency: 400kHz

spi:
  - id: spi_1
    clk_pin: GPIO7
    miso_pin: GPIO9
    mosi_pin: GPIO8
    type: single

# =============================================================================
# DISPLAY
# =============================================================================

globals:
  - id: last_model
    type: std::string
    initial_value: '"none"'

font:
  - id: main_font
    file:
      type: gfonts
      family: Golos Text
    size: 12
  - id: bold_font
    file:
      type: gfonts
      family: Golos Text
      weight: bold
    size: 12

display:
  - platform: ssd1306_i2c
    id: display_ssd1306_i2c_1
    i2c_id: i2c_1
    model: SSD1306_128X64
    lambda: |-
      it.print(0, 0, id(bold_font), "433 MHz bridge");
      it.print(0, 16, id(main_font), id(ip_address).has_state() ? id(ip_address).state.c_str() : "no network");
      if (id(uptime_s).has_state()) {
        uint32_t up = id(uptime_s).state;
        it.printf(0, 32, id(main_font), "Up %ud %02u:%02u", up / 86400, (up / 3600) % 24, (up / 60) % 60);
      }
      if (id(wifi_signal_db).has_state())
        it.printf(127, 32, id(main_font), TextAlign::TOP_RIGHT, "%.0f dB", id(wifi_signal_db).state);
      it.printf(0, 48, id(main_font), "RX: %s", id(last_model).c_str());

# =============================================================================
# RADIO
# =============================================================================

# Receive-only, so gdo0_pin is left unset: the component only uses it to flip
# GDO0 into an output for transmitting.
cc1101:
  - id: cc1101_1
    cs_pin: GPIO6
    gdo2_mode: "Carrier Sense"
    # Full DVGA gain and the most sensitive carrier-sense threshold still enabled
    # (-8 disables it); the defaults kept GDO0/GDO2 silent on a quiet band.
    carrier_sense_abs_thr: -7
    max_dvga_gain: "Default"

rtl_433:
  receivers:
    - id: rtl_ook
      cc1101_id: cc1101_1
      data_pin: GPIO5
      carrier_sense_pin: GPIO10
      on_decode:
        # The display only needs the model, so pull it out of the JSON rather than parse it all.
        - lambda: |-
            const std::string key = "\"model\":\"";
            auto start = x.find(key);
            if (start != std::string::npos) {
              start += key.size();
              id(last_model) = x.substr(start, x.find('"', start) - start);
            }
        - homeassistant.event:
            event: esphome.rtl_433
            data:
              json: !lambda return x;
